<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Compute Experience</title>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand-block">
        <div class="brand">Compute Experience</div>
        <div class="brand-sub">Computational Inspector</div>
      </div>
      <div class="actions">
        <div class="action-group action-primary">
          <button class="control control-accent" id="fork" type="button">Fork</button>
          <button class="control control-ghost" id="clearBranch" type="button">Clear branch</button>
        </div>
        <span class="action-sep" aria-hidden="true"></span>
        <select class="control control-select" id="modelSelect"></select>
        <button class="control drawer-toggle" id="drawerToggle" type="button">Inspect</button>
        <span class="action-sep" aria-hidden="true"></span>
        <button class="control control-ghost" id="reset" type="button">Reset</button>
        <button class="control control-ghost" id="save" type="button">Save</button>
        <button class="control control-ghost" id="restore" type="button">Restore</button>
        <button class="control control-ghost" id="export" type="button">Export</button>
        <button class="control control-ghost" id="import" type="button">Import</button>
        <input id="importFile" type="file" accept="application/json" hidden />
      </div>
    </header>
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <div class="eyebrow" id="sidebarEyebrow">Counterfactual run</div>
          <div class="title" id="modelName">—</div>
          <p class="desc" id="modelDesc"></p>
        </div>
        <div id="params"></div>
        <div class="cf-panel" id="counterfactualPanel"></div>
        <div class="cf-panel" id="inspectorPanel"></div>
        <div class="metrics" id="metrics"></div>
      </aside>
      <main class="main">
        <div class="subbar">
          <span class="subbar-id" id="modelId">—</span>
          <span class="subbar-flow" id="runtimeLabel">run · inspect · trace · replay</span>
        </div>
        <div class="stage">
          <div class="stage-vignette"></div>
          <div class="grid"></div>
          <div class="hud">
            <div class="state-fields" id="stateFields"></div>
            <div class="pill pill-muted" id="stateCount">0 states</div>
            <div class="pill pill-muted" id="rendererPill">renderer —</div>
            <button class="pill pill-divergence" id="divergence" type="button" hidden></button>
          </div>
          <div class="viewport" id="viewport"></div>
          <div class="renderer-overlay" id="rendererOverlay"></div>
          <div class="timeline-shell" id="timelineShell">
            <button class="play-btn" id="play" type="button" aria-label="Play">▶</button>
            <div class="scrub-wrap">
              <div class="scrub-track"></div>
              <input class="scrub" id="scrub" type="range" min="0" max="0" step="1" value="0">
            </div>
            <span class="time" id="time">0.00</span>
          </div>
        </div>
        <footer class="footer">
          <div class="footer-copy">
            <div class="footer-kicker">Inspect · trace · intervene · replay</div>
            <p>Enter the computation: select a value, trace its ancestors, intervene, and watch the future reshape.</p>
          </div>
          <div class="footer-code">model → run → fork → experience</div>
        </footer>
      </main>
    </div>
  </div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>
