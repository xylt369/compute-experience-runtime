<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Compute Experience</title>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">COMPUTE EXPERIENCE / RUNTIME</div>
      <div class="actions">
        <button class="control drawer-toggle" id="drawerToggle" type="button">Params</button>
        <select class="control" id="modelSelect"></select>
        <button class="control" id="fork" type="button">Fork</button>
        <button class="control" id="clearBranch" type="button">Clear branch</button>
        <button class="control" id="reset" type="button">Reset</button>
        <button class="control" id="save" type="button">Save</button>
        <button class="control" id="restore" type="button">Restore</button>
        <button class="control" id="export" type="button">Export</button>
        <button class="control" id="import" type="button">Import</button>
        <input id="importFile" type="file" accept="application/json" hidden />
      </div>
    </header>
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="eyebrow" id="sidebarEyebrow">Model manifest</div>
        <div class="title" id="modelName">—</div>
        <p class="desc" id="modelDesc"></p>
        <div id="params"></div>
        <div id="counterfactualPanel"></div>
        <div class="metrics" id="metrics"></div>
      </aside>
      <main class="main">
        <div class="subbar">
          <span id="modelId">—</span>
          <span id="runtimeLabel">run → observe → fork → compare</span>
        </div>
        <div class="stage">
          <div class="grid"></div>
          <div class="hud">
            <div class="pill" id="stateCount">0 states</div>
            <div class="pill" id="rendererPill">renderer: —</div>
            <button class="pill divergence-event" id="divergence" type="button" hidden></button>
          </div>
          <div class="viewport" id="viewport"></div>
          <div class="renderer-overlay" id="rendererOverlay"></div>
          <div class="timeline-shell" id="timelineShell">
            <button id="play" type="button">▶</button>
            <div class="scrub-wrap">
              <input class="scrub" id="scrub" type="range" min="0" max="0" step="1" value="0">
            </div>
            <span class="time" id="time">0.00</span>
          </div>
        </div>
        <footer class="footer">
          <div class="footer-copy">
            <div class="footer-kicker">Counterfactual computation</div>
            <p>Same past, different intervention, different future. Play · pause · seek · fork · inspect divergence.</p>
          </div>
          <div class="footer-code">model → run → fork → experience</div>
        </footer>
      </main>
    </div>
  </div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>
